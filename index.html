<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG & PDF Size Tool - Batch</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body {
            background: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #111827;
            border: 1px solid #1e293b;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
        }
        h2 { text-align: center; color: #00f0ff; margin-top: 0; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        .drop-zone {
            border: 2px dashed #334155;
            background: #1e293b;
            border-radius: 12px;
            padding: 20px 14px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #00f0ff;
            background: #0f2942;
        }
        input[type="file"] { display: none; }
        .size-row { display: flex; gap: 10px; }
        .size-row input { flex: 1; }
        .size-row select { width: 90px; }
        input[type="number"], select {
            width: 100%;
            padding: 11px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus { border-color: #00f0ff; }
        .file-list {
            background: #1e293b;
            border-left: 3px solid #00f0ff;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 16px;
            display: none;
            max-height: 160px;
            overflow-y: auto;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        }
        .file-item:last-child { border-bottom: none; }
        .status-ok { color: #4ade80; }
        .status-err { color: #f87171; }
        .status-wait { color: #38bdf8; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #00f0ff, #0077ff);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg { margin-top: 14px; text-align: center; font-size: 14px; }
        .error { color: #f87171; }
        .success { color: #4ade80; }
    </style>
</head>
<body>
<div class="card">
    <h2>JPG & PDF Size Tool</h2>
    <form id="uploadForm">
        <div class="form-group">
            <label>একাধিক ফাইল সিলেক্ট করুন (.JPG বা .PDF)</label>
            <div class="drop-zone" id="dropZone">
                <div id="dropText">এক বা একাধিক ফাইল ড্র্যাগ করুন বা ট্যাপ করে সিলেক্ট করুন</div>
            </div>
            <input type="file" id="fileInput" accept=".jpg,.jpeg,.pdf" multiple required>
        </div>

        <div class="file-list" id="fileList"></div>

        <div class="form-group">
            <label>কাজের ধরন</label>
            <select id="modeSelect">
                <option value="compress">Compress (সাইজ কমান)</option>
                <option value="increase">Increase (সাইজ বাড়ান)</option>
            </select>
        </div>

        <div class="form-group">
            <label>টার্গেট সাইজ (প্রতিটি ফাইলের জন্য)</label>
            <div class="size-row">
                <input type="number" id="targetSize" placeholder="যেমন: 200 বা 1.5" min="0.01" step="any" required>
                <select id="unitSelect">
                    <option value="KB">KB</option>
                    <option value="MB">MB</option>
                </select>
            </div>
        </div>

        <button type="submit" id="submitBtn">সব ফাইল প্রসেস ও ডাউনলোড করুন</button>
        <div class="msg" id="statusMsg"></div>
    </form>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const dropText = document.getElementById('dropText');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const form = document.getElementById('uploadForm');
const statusMsg = document.getElementById('statusMsg');
const submitBtn = document.getElementById('submitBtn');
const targetSizeInput = document.getElementById('targetSize');
const unitSelect = document.getElementById('unitSelect');

let selectedFiles = [];

function formatSize(bytes) {
    const kb = bytes / 1024;
    return kb >= 1024 ? `${kb.toFixed(2)} KB (${(kb / 1024).toFixed(2)} MB)` : `${kb.toFixed(2)} KB`;
}

function isValidFile(file) {
    const name = file.name.toLowerCase();
    return name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.pdf');
}

function renderFileList() {
    if (selectedFiles.length === 0) {
        fileList.style.display = 'none';
        fileList.innerHTML = '';
        dropText.textContent = 'এক বা একাধিক ফাইল ড্র্যাগ করুন বা ট্যাপ করে সিলেক্ট করুন';
        return;
    }
    dropText.textContent = `${selectedFiles.length}টি ফাইল সিলেক্টেড`;
    fileList.style.display = 'block';
    fileList.innerHTML = selectedFiles.map((file, idx) => `
        <div class="file-item" id="row-${idx}">
            <span>${file.name} (${formatSize(file.size)})</span>
            <span class="status-wait" id="st-${idx}">প্রস্তুত</span>
        </div>
    `).join('');
}

function handleFiles(fileListObj) {
    const incoming = Array.from(fileListObj || []);
    const valid = incoming.filter(isValidFile);
    if (valid.length !== incoming.length) {
        statusMsg.className = 'msg error';
        statusMsg.textContent = 'অসমর্থিত ফাইল বাদ দেওয়া হয়েছে (শুধুমাত্র .JPG, .JPEG, .PDF)।';
    } else {
        statusMsg.textContent = '';
    }
    selectedFiles = valid;
    renderFileList();
}

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

['dragenter', 'dragover'].forEach(ev => {
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); });
});
['dragleave', 'drop'].forEach(ev => {
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
});
dropZone.addEventListener('drop', e => {
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFiles(e.dataTransfer.files);
    }
});

form.addEventListener('submit', async e => {
    e.preventDefault();
    const val = parseFloat(targetSizeInput.value);
    if (selectedFiles.length === 0 || isNaN(val) || val <= 0) return;

    const mode = document.getElementById('modeSelect').value;
    const targetKb = unitSelect.value === 'MB' ? val * 1024 : val;

    submitBtn.disabled = true;
    statusMsg.textContent = '';
    let successCount = 0;

    for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        const stEl = document.getElementById(`st-${i}`);
        submitBtn.textContent = `প্রসেসিং (${i + 1}/${selectedFiles.length})...`;
        if (stEl) {
            stEl.className = 'status-wait';
            stEl.textContent = 'চলছে...';
        }

        const fd = new FormData();
        fd.append('file', file);
        fd.append('mode', mode);
        fd.append('target_kb', targetKb);

        try {
            const res = await fetch('/process', { method: 'POST', body: fd });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                if (stEl) {
                    stEl.className = 'status-err';
                    stEl.textContent = err.error || 'ব্যর্থ';
                }
            } else {
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${mode}_${file.name}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);

                successCount++;
                if (stEl) {
                    stEl.className = 'status-ok';
                    stEl.textContent = `${formatSize(blob.size)}`;
                }
            }
        } catch {
            if (stEl) {
                stEl.className = 'status-err';
                stEl.textContent = 'নেটওয়ার্ক ত্রুটি';
            }
        }
    }

    submitBtn.disabled = false;
    submitBtn.textContent = 'সব ফাইল প্রসেস ও ডাউনলোড করুন';
    statusMsg.className = successCount > 0 ? 'msg success' : 'msg error';
    statusMsg.textContent = `${selectedFiles.length}টির মধ্যে ${successCount}টি ফাইল সফলভাবে প্রসেস হয়েছে।`;
});
</script>
</body>
</html>
